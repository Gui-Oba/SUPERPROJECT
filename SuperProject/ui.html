<h2>Gemini Cleaner</h2>

<p>Select layers on the canvas and click Clean Up.</p>

<button id="clean-up">✨ Auto-Rename Layers</button>
<button id="cancel" class="secondary">Close</button>
<p id="status" style="color: #888; font-size: 11px; margin-top: 8px;"></p>

<style>
  body { font-family: sans-serif; padding: 10px; }
  /* Cleaned up styles since input is gone */
  button { 
    background: #18A0FB; color: white; border: none; padding: 8px 16px; 
    border-radius: 6px; cursor: pointer; margin-right: 5px;
  }
  button.secondary { background: transparent; color: #333; border: 1px solid #ccc; }
</style>

<script>
// --- CONFIGURATION ---
const API_KEY = "AIzaSyDhYGibIjyoBcclfVp6Lr3Yka-SICRKu5c"; 
console.log(API_KEY.includes("AIzaSyDhYGibIjyoBcclfVp6Lr3Yka-SICRKu5c"));
// ---------------------

// 1. Listen for messages from the plugin code (code.ts)
window.onmessage = async (event) => {
  const msg = event.data.pluginMessage;

  if (msg.type === 'selection-data') {
    await callGemini(msg.layers);
  }
};

document.getElementById('clean-up').onclick = () => {
  if (!API_KEY || !API_KEY.includes("AIzaSyDhYGibIjyoBcclfVp6Lr3Yka-SICRKu5c")) {
    alert("Please add your API Key inside ui.html code");
    return;
  }
  
  document.getElementById('status').innerText = "Analyzing layers...";
  // Ask code.ts for the currently selected layers
  parent.postMessage({ pluginMessage: { type: 'get-selection' } }, '*');
}

document.getElementById('cancel').onclick = () => {
  parent.postMessage({ pluginMessage: { type: 'cancel' } }, '*')
}

// 2. Function to call Google Gemini API

async function callGemini(layers) {
  if (layers.length === 0) {
    document.getElementById('status').innerText = "No layers selected.";
    return;
  }

  const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${API_KEY}`;

  const promptText = `
    You are a Figma Design System Expert. I will provide a list of layers.
    Your task is to "Clean Up" these layers by suggesting:
    1. Rounded, consistent Sizes (width/height).
    2. Standardized Spacing (x/y coordinates).
    3. Better Colors (if colors are messy or off-brand).
    4. Descriptive Names.

    Input Data: ${JSON.stringify(layers)}

    Return ONLY a raw JSON object where the keys are the layer IDs.
    Format: 
    {
      "layerId": {
        "name": "New Name",
        "x": 100,
        "y": 200,
        "width": 150,
        "height": 50,
        "color": {"r": 1, "g": 0, "b": 0} 
      }
    }
    Important: Use decimal RGB (0 to 1) for colors. Do not include markdown backticks.
  `;

  try {
    const response = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ contents: [{ parts: [{ text: promptText }] }] })
    });

    const data = await response.json();
    if (data.error) throw new Error(data.error.message);

    const resultText = data.candidates[0].content.parts[0].text;
    const cleanJson = resultText.replace(/```json/g, '').replace(/```/g, '').trim();
    const cleanupData = JSON.parse(cleanJson);

    // Send the full cleanup instructions to the backend
    parent.postMessage({ pluginMessage: { type: 'apply-cleanup', data: cleanupData } }, '*');
    document.getElementById('status').innerText = "Clean up complete!";
  } catch (error) {
    console.error("Gemini Error:", error);
    document.getElementById('status').innerText = "Clean up failed.";
  }
}
</script>
